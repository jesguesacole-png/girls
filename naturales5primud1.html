const KEY='mision_naturales_5_tema1_v1';
const THEMES=['menta','azul','lavanda','coral','noche'];
const empty=()=>({theme:'menta',font:16,known:{},stats:{practices:0,correct:0,exams:[],words:0,wordsCorrect:0,orders:0,ordersCorrect:0,cell:0},cellKnown:{},seen:{}});
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));return s&&typeof s==='object'?{...empty(),...s,stats:{...empty().stats,...s.stats}}:empty()}catch(e){return empty()}})();

let quiz=null,wordSession=null,orderSession=null,cellSession=null,examReviewAll=false;
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const nameOf=(id)=>DATA.topics.find(x=>x.id===id)?.title||id;
const rand=(a)=>[...a].sort(()=>Math.random()-.5);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function applyPrefs(){if(!THEMES.includes(S.theme))S.theme='menta';S.font=Math.max(14,Math.min(22,Number(S.font)||16));document.documentElement.dataset.theme=S.theme;document.documentElement.style.fontSize=S.font+'px'}
function number(n){return Number(n||0)}
function countKnown(){return Object.values(S.known).filter(x=>x==='know').length}
function bestExam(){return Math.max(0,...(S.stats.exams||[]).map(e=>number(e.correct)/Math.max(1,number(e.total))))}
function overall(){const a=countKnown()/DATA.cards.length*.43,b=Math.min(1,number(S.stats.practices)/30)*.18,c=bestExam()*.29,d=Math.min(1,Object.keys(S.cellKnown||{}).length/4)*.10;return Math.round((a+b+c+d)*100)}
function progress(p){return `<div class="bar" aria-label="${p}% completado"><span style="width:${Math.min(100,Math.max(0,p))}%"></span></div>`}
function motive(){let p=overall();if(p===0)return '¡Cada gran descubrimiento comienza con la primera pregunta! 🌱';if(p<25)return '¡Buen comienzo! Cada tarjeta que aprendes cuenta. ✨';if(p<50)return '¡Estás construyendo tus conocimientos paso a paso! 💪';if(p<75)return '¡Qué avance! Repasa los errores y sigue explorando. 🔎';if(p<100)return '¡Ya dominas mucho del tema! El siguiente reto está cerca. 🌟';return '¡Misión completada! Sigue repasando para recordarlo bien. 🏆'}
function header(){let items=[['home','Inicio'],['flash','Tarjetas'],['practice','Practicar'],['exam','Simulacro'],['study','Repasar']];$('header').innerHTML=`<div class="brand"><div class="brand-mark" aria-hidden="true">🔬</div><div>Misión Naturales<small>Tema 1 · 5.º de Primaria</small></div></div><nav class="header-actions" aria-label="Navegación principal">${items.map(([k,v])=>`<button class="pill ${view===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}${view==='home'||view==='settings'?`<button class="pill ${view==='settings'?'active':''}" onclick="go('settings')" aria-label="Ajustes">⚙️ Ajustes</button>`:''}</nav>`}
function render(){applyPrefs();header();let f={home,flash,practice,exam,study,settings,quizview,wordview,orderview,cellview}[view];$('app').innerHTML=f?f():home()}
function go(v){if(quiz && view==='quizview' && quiz.idx<quiz.items.length && !quiz.finished && !confirm('¿Salir del cuestionario actual? Las respuestas de esta sesión no se guardarán.'))return;if(v==='settings' && view!=='home' && view!=='settings')return;view=v; if(v!=='quizview')quiz=null;render();window.scrollTo(0,0)}
function home(){let best=Math.round(bestExam()*100);return `<section class="hero"><div class="card hero-primary"><div class="eyebrow">🌿 Tu laboratorio de aprendizaje</div><h1>¡Descubre cómo funciona nuestro cuerpo!</h1><p class="muted">Estudia con tarjetas, comprueba lo que sabes y prepárate para el examen. Todo lo que aparece aquí procede de tus <strong>dos documentos de estudio</strong>.</p><div class="btnrow"><button class="btn primary" onclick="go('flash')">🗂️ Empezar con tarjetas</button><button class="btn ghost" onclick="go('exam')">📝 Hacer simulacro</button></div><p class="small" style="margin-top:18px;margin-bottom:0"><strong>${motive()}</strong></p></div><div class="card hero-aside"><div class="ring" style="--percent:${overall()}"><div class="ring-label"><strong>${overall()}%</strong><span>de avance</span></div></div><div><strong>Tu progreso</strong><p class="muted small" style="margin-bottom:0">Indicador de práctica, no nota del colegio.</p></div></div></section><section class="statgrid"><div class="stat"><strong>${countKnown()} / ${DATA.cards.length}</strong><span>Tarjetas aprendidas</span></div><div class="stat"><strong>${number(S.stats.practices)}</strong><span>Preguntas practicadas</span></div><div class="stat"><strong>${S.stats.exams.length?best+'%':'—'}</strong><span>Mejor simulacro</span></div><div class="stat"><strong>${Math.min(4,Object.keys(S.cellKnown||{}).length)} / 4</strong><span>Partes de la célula identificadas</span></div></section><div class="sectionbar"><h2 style="margin:0">Elige cómo aprender</h2><span class="tag">A tu ritmo · sin temporizador</span></div><section class="modegrid">${[['flash','🗂️','Tarjetas inteligentes','Dales la vuelta y marca lo que ya sabes.'],['practice','🧠','Practicar','Preguntas, palabras, órdenes y dibujo de la célula.'],['exam','📝','Simulacro de examen','20 preguntas con corrección y nota sobre 10.'],['study','📚','Resumen de estudio','Toda la información esencial organizada por apartados.'],['settings','🎨','Personalizar','Cambia los colores y el tamaño de letra.'],['practice','🧬','Reto visual','Señala las partes de la célula en un esquema.']].map(([v,i,t,d],idx)=>`<button class="modecard" onclick="${idx===5?"startCell()":`go('${v}')`}"><span class="modeicon">${i}</span><strong>${t}</strong><span>${d}</span></button>`).join('')}</section><div class="sectionbar"><h2 style="margin:0">Los 10 bloques del tema</h2></div><section class="topicgrid">${DATA.topics.map(t=>`<button class="topicbtn" onclick="openTopic('${t.id}')"><span class="te">${t.emoji}</span><span><strong>${t.title}</strong><small>${t.sub}</small></span></button>`).join('')}</section>`}
function openTopic(t){cardTopic=t;cardIndex=0;flipped=false;view='flash';render();window.scrollTo(0,0)}
function filteredCards(){return DATA.cards.map((c,i)=>({...c,i})).filter(c=>(cardTopic==='all'||c.t===cardTopic)&&(cardMode==='all'||(cardMode==='pending'&&S.known[c.i]!=='know')||(cardMode==='hard'&&S.known[c.i]==='hard')))}
function cardFilter(t){cardTopic=t;cardIndex=0;flipped=false;render()}

function flash(){let pool=filteredCards();if(cardIndex>=pool.length)cardIndex=0;let c=pool[cardIndex];return `<div class="mainhead"><div><p class="eyebrow">Tarjetas de memoria</p><h1>Aprendo con flashcards</h1><p class="muted">Intenta responder antes de girar la tarjeta. Puedes marcarla como aprendida o para repasar.</p></div><span class="tag">${countKnown()} aprendidas</span></div><div class="workgrid"><section class="card"><div class="btnrow" style="justify-content:space-between;margin-bottom:18px"><label><span class="sr-only">Elige un bloque</span><select class="select" onchange="cardFilter(this.value)"><option value="all">Todos los bloques</option>${DATA.topics.map(t=>`<option value="${t.id}" ${cardTopic===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select></label><span class="small muted">${pool.length?cardIndex+1:0} / ${pool.length} tarjetas</span></div>${pool.length?`<div class="progress-label"><span>Tarjetas de esta selección</span><span>${Math.round((cardIndex+1)/pool.length*100)}%</span></div>${progress(Math.round((cardIndex+1)/pool.length*100))}<div class="flash-stage" onclick="flipCard()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipCard() }" aria-label="Girar la tarjeta"><span class="tag flash-badge">${DATA.topics.find(t=>t.id===c.t)?.emoji} ${nameOf(c.t)}</span>${!flipped?`<div class="fronttext">${esc(c.q)}</div>`:`<div class="backtext">${esc(c.a)}</div>`}<span class="fliphint">${flipped?'Toca para volver a la pregunta':'Toca para descubrir la respuesta'}</span></div><div class="flashnav"><button class="btn" onclick="moveCard(-1)">← Anterior</button><span class="small muted">${S.known[c.i]==='know'?'✅ Aprendida':S.known[c.i]==='hard'?'🔁 Por repasar':'✨ Nueva'}</span><button class="btn" onclick="moveCard(1)">Siguiente →</button></div><div class="btnrow" style="justify-content:center"><button class="btn" onclick="markCard('hard')">🔁 Aún me cuesta</button><button class="btn primary" onclick="markCard('know')">✓ Ya la sé</button></div>`:`<div class="tone"><h3>¡Sin tarjetas en este filtro!</h3><p>Si ya las has aprendido todas, prueba «Todas» o selecciona otro bloque.</p><button class="btn" onclick="cardStatus('all')">Ver todas</button></div>`}</section><aside class="card"><h3>Tu memoria se entrena</h3><div class="progress-label"><span>Tarjetas aprendidas</span><span>${countKnown()} / ${DATA.cards.length}</span></div>${progress(Math.round(countKnown()/DATA.cards.length*100))}<p class="small muted" style="margin-top:14px">No hace falta memorizar de golpe. Repasa primero las que te cuestan y vuelve a intentarlo.</p><div class="btnrow"><button class="btn small ${cardMode==='all'?'primary':''}" onclick="cardStatus('all')">Todas</button><button class="btn small ${cardMode==='pending'?'primary':''}" onclick="cardStatus('pending')">Pendientes</button><button class="btn small ${cardMode==='hard'?'primary':''}" onclick="cardStatus('hard')">Difíciles</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><p class="tiny muted">Las marcas se guardan únicamente en este dispositivo y navegador.</p></aside></div>`}
function flipCard(){flipped=!flipped;render()}
function moveCard(x){let a=filteredCards();if(!a.length)return;cardIndex=(cardIndex+x+a.length)%a.length;flipped=false;render()}
function markCard(v){let a=filteredCards();if(!a.length)return;S.known[a[cardIndex].i]=v;save();flipped=false;if(cardMode==='all')cardIndex=(cardIndex+1)%a.length;else{const next=filteredCards();if(cardIndex>=next.length)cardIndex=0}render()}
function practice(){return `<div class="mainhead"><div><div class="eyebrow">Aprender haciendo</div><h1>Zona de práctica</h1><p class="muted">Aquí puedes equivocarte sin problema: cada respuesta se corrige y te explica por qué.</p></div><span class="tag">Sin límite de intentos</span></div><div class="modegrid">${[['🧠','Preguntas tipo test','10 preguntas autocorregibles y explicaciones.',"startQuiz('practice')"],['✏️','Completa palabras','Escribe las palabras importantes del tema.',"startWords()"],['🔄','Ordena los pasos','Ordena los procesos y recorridos del cuerpo.',"startOrder()"],['🔬','Señala la célula','Identifica cuatro partes en un dibujo.',"startCell()"]].map(([i,t,d,action])=>`<button class="modecard" onclick="${action}"><span class="modeicon">${i}</span><strong>${t}</strong><span>${d}</span></button>`).join('')}</div><div class="sectionbar"><h2 style="margin:0">Tus entrenamientos</h2></div><section class="statgrid"><div class="stat"><strong>${S.stats.practices}</strong><span>Preguntas realizadas</span></div><div class="stat"><strong>${S.stats.practices?Math.round(S.stats.correct/S.stats.practices*100)+'%':'—'}</strong><span>Aciertos tipo test</span></div><div class="stat"><strong>${S.stats.wordsCorrect} / ${S.stats.words}</strong><span>Palabras a la primera</span></div><div class="stat"><strong>${S.stats.ordersCorrect} / ${S.stats.orders}</strong><span>Órdenes a la primera</span></div></section><div class="note">💡 Consejo: antes de hacer un simulacro, intenta explicar con tus palabras las funciones vitales y los cuatro aparatos de la nutrición.</div>`}
function sample(a,n){return rand(a).slice(0,n)}
function shuffleOptions(entry){let order=rand([0,1,2,3]);return {...entry,type:'mc',o:order.map(i=>entry.o[i]),a:order.indexOf(entry.a)}}
function buildExam(){let list=[];for(const t of DATA.topics){const n=(t.id==='respiracion'||t.id==='organizacion')?1:2;list.push(...sample(DATA.questions.filter(q=>q.t===t.id),n).map(shuffleOptions))}for(const t of ['respiracion','organizacion']){let s=DATA.seqs.find(x=>x.t===t);list.push({...s,type:'seq'})}return rand(list)}
function startQuiz(mode='practice',wrongItems=null){let items=wrongItems?wrongItems:mode==='exam'?buildExam():sample(DATA.questions,10).map(shuffleOptions);quiz={mode,items,idx:0,answers:[],selected:[],pool:[],revealed:false,finished:false};view='quizview';render();window.scrollTo(0,0)}
function exam(){const last=S.stats.exams.at(-1);return `<div class="mainhead"><div><p class="eyebrow">Comprueba lo aprendido</p><h1>Simulacro de examen</h1><p class="muted">20 ejercicios basados en el tema: 18 preguntas de elección y 2 de ordenar. Se incluyen preguntas de los diez bloques.</p></div><span class="tag">Puntuación sobre 10</span></div><div class="hero"><section class="card hero-primary"><div class="splash">📝</div><h2>¿Preparada para demostrar lo que sabes?</h2><p>No hay tiempo límite. Durante el examen <strong>no aparecen las soluciones</strong>; cuando termines, verás tu nota y qué tienes que repasar.</p><div class="btnrow"><button class="btn primary" onclick="startQuiz('exam')">Empezar simulacro →</button><button class="btn ghost" onclick="go('study')">Repasar antes</button></div></section><aside class="card"><h3>Historial de simulacros</h3><p><strong>${S.stats.exams.length}</strong> realizados</p><p>Mejor resultado: <strong>${S.stats.exams.length?(bestExam()*10).toFixed(1).replace('.',',')+'/10':'—'}</strong></p>${last?`<p class="small muted">Última nota: ${(10*last.correct/last.total).toFixed(1).replace('.',',')}/10</p>`:''}<p class="small muted">Los resultados se conservan en el navegador mientras no se borren sus datos.</p></aside></div>`}
function quizview(){if(!quiz)return '<p>No hay un cuestionario en curso.</p>';if(quiz.finished)return results();const it=quiz.items[quiz.idx];const isSeq=it.type==='seq';let sel=quiz.answers[quiz.idx],done=!!sel;let isPractice=quiz.mode!=='exam';let answered=isPractice&&quiz.revealed;let current=quiz.idx+1,total=quiz.items.length;let head=`<div class="mainhead"><div><p class="eyebrow">${quiz.mode==='exam'?'Simulacro de examen':'Práctica con corrección'}</p><h1>${quiz.mode==='exam'?'Responde sin mirar la solución':'Aprende una pregunta cada vez'}</h1></div><span class="tag">${current} / ${total}</span></div><div class="progress-label"><span>Preguntas</span><span>${Math.floor((quiz.idx)/total*100)}% completado</span></div>${progress(Math.floor((quiz.idx)/total*100))}`;
let body=`<section class="card" style="margin-top:16px"><span class="tag">${nameOf(it.t)}</span><div class="quiztitle">${esc(it.q)}</div>`;
if(!isSeq){body+=`<div class="options">${it.o.map((o,i)=>`<button class="opt ${answered&&i===it.a?'correct':''} ${answered&&sel.choice===i&&i!==it.a?'incorrect':''}" ${done?'disabled':''} onclick="answerMC(${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`}else{if(!quiz.pool.length){quiz.pool=rand(it.parts.map((p,i)=>({p,i}))); if(quiz.pool.map(x=>x.i).every((x,i)=>x===i))quiz.pool.reverse()}
body+=`<p class="small muted" style="margin-top:12px">Toca las piezas en el orden correcto. Puedes deshacer la última.</p><div class="sequence-area answerline" aria-label="Orden que has elegido">${quiz.selected.length?quiz.selected.map((j,k)=>`<span class="steppill">${esc(it.parts[j])}</span>${k<quiz.selected.length-1?'<span class="seqarrow">→</span>':''}`).join(''):'<span class="muted">Aquí irá apareciendo tu secuencia.</span>'}</div><div class="sequence-area" aria-label="Piezas por ordenar">${quiz.pool.filter(x=>!quiz.selected.includes(x.i)).map(x=>`<button class="stepchip" onclick="chooseSeq(${x.i})" ${done?'disabled':''}>${esc(x.p)}</button>`).join('')}</div><div class="btnrow"><button class="btn small" onclick="undoSeq()" ${done||!quiz.selected.length?'disabled':''}>↶ Deshacer</button><button class="btn primary" onclick="checkSeq()" ${done||quiz.selected.length!==it.parts.length?'disabled':''}>Confirmar orden</button></div>`}
if(answered){body+=`<div class="feedback ${sel.correct?'':'bad'}"><strong>${sel.correct?'¡Bien hecho! 🌟':'Buen intento. Vamos a aprenderlo. 💡'}</strong><div>${esc(it.type==='mc'?it.why:'Orden correcto: '+it.parts.join(' → '))}</div>${!sel.correct&&it.type==='mc'?`<div style="margin-top:7px">Respuesta correcta: <strong>${esc(it.o[it.a])}</strong></div>`:''}</div>`}if(answered)body+=`<div class="actions-bottom"><span class="muted small">${sel.correct?'¡Sigue así!':'Equivocarse también ayuda a aprender.'}</span><button class="btn primary" onclick="nextQuiz()">${quiz.idx===total-1?'Ver resultados':'Siguiente pregunta →'}</button></div>`;
if(quiz.mode==='exam')body+=`<p class="small muted" style="margin-top:15px">La corrección aparecerá al finalizar el examen.</p>`;
body+='</section>';return head+body}
function answerMC(i){if(!quiz||quiz.answers[quiz.idx])return;const it=quiz.items[quiz.idx];let correct=i===it.a;quiz.answers[quiz.idx]={choice:i,correct};if(quiz.mode==='exam'){quiz.idx++;if(quiz.idx>=quiz.items.length)finishQuiz();else{quiz.pool=[];quiz.selected=[]}}else{quiz.revealed=true;S.stats.practices++;if(correct)S.stats.correct++;save()}render();if(quiz.mode==='exam')window.scrollTo(0,0)}
function chooseSeq(j){if(quiz?.answers[quiz.idx]||quiz.selected.includes(j))return;quiz.selected.push(j);render()}
function undoSeq(){if(!quiz?.selected.length)return;quiz.selected.pop();render()}
function checkSeq(){if(!quiz||quiz.answers[quiz.idx])return;let it=quiz.items[quiz.idx];if(quiz.selected.length!==it.parts.length)return;let correct=quiz.selected.every((x,i)=>x===i);quiz.answers[quiz.idx]={choice:[...quiz.selected],correct};if(quiz.mode==='exam'){quiz.idx++;quiz.selected=[];quiz.pool=[];if(quiz.idx>=quiz.items.length)finishQuiz();else render()}else{quiz.revealed=true;S.stats.orders++;if(correct)S.stats.ordersCorrect++;save();render()}}
function nextQuiz(){if(!quiz)return;quiz.idx++;quiz.revealed=false;quiz.selected=[];quiz.pool=[];if(quiz.idx>=quiz.items.length)finishQuiz();else render()}
function finishQuiz(){quiz.finished=true;const correct=quiz.answers.filter(x=>x.correct).length;if(quiz.mode==='exam'){S.stats.exams.push({at:new Date().toISOString(),correct,total:quiz.items.length});S.stats.exams=S.stats.exams.slice(-30)}save();render();window.scrollTo(0,0)}
function results(){let correct=quiz.answers.filter(a=>a.correct).length,total=quiz.items.length,score=10*correct/total,miss=quiz.items.map((it,i)=>({...it,ans:quiz.answers[i],index:i})).filter(a=>!a.ans.correct);return `<div class="mainhead"><div><p class="eyebrow">Revisión de la prueba</p><h1>${quiz.mode==='exam'?'Resultado del simulacro':'Práctica terminada'}</h1></div></div><div class="card result-score"><span class="splash">${score>=9?'🏆':score>=7?'🌟':score>=5?'💪':'🌱'}</span><strong>${score.toFixed(1).replace('.',',')} / 10</strong><p>${correct} respuestas correctas de ${total}</p><p class="muted">${score>=9?'¡Gran trabajo! Has demostrado que conoces el tema.':score>=7?'¡Buen trabajo! Repasa los pocos puntos que te faltan.':score>=5?'¡Vas avanzando! Revisa los errores y prueba otra vez.':'Cada intento ayuda a aprender. Repasa las tarjetas y vuelve a practicar.'}</p><div class="btnrow" style="justify-content:center"><button class="btn primary" onclick="${quiz.mode==='exam'?"go('exam')":"go('practice')"}">Volver</button>${miss.length?`<button class="btn" onclick="retryMistakes()">🔄 Practicar errores (${miss.length})</button>`:''}<button class="btn" onclick="examReviewAll=!examReviewAll;render()">${examReviewAll?'Mostrar solo errores':'Ver todas las respuestas'}</button></div></div><section style="margin-top:22px"><h2>${examReviewAll?'Revisión completa':'Qué conviene repasar'}</h2>${!miss.length&&!examReviewAll?'<div class="tone">¡Todas correctas! Puedes repetir el examen con otras preguntas.</div>':''}${(examReviewAll?quiz.items.map((it,i)=>({...it,ans:quiz.answers[i],index:i})):miss).map(it=>`<article class="reviewitem ${it.ans.correct?'good':'bad'}"><div class="qnum">Pregunta ${it.index+1} · ${nameOf(it.t)} · ${it.ans.correct?'✓ Bien':'↻ Para repasar'}</div><p><strong>${esc(it.q)}</strong></p><p class="choicehint">Tu respuesta: ${it.type==='seq'?esc(it.ans.choice.map(i=>it.parts[i]).join(' → ')):esc(it.o[it.ans.choice])}</p><p>Correcta: <strong>${it.type==='seq'?esc(it.parts.join(' → ')):esc(it.o[it.a])}</strong></p>${it.type==='mc'?`<p class="small muted">${esc(it.why)}</p>`:''}</article>`).join('')}</section>`}
function retryMistakes(){if(!quiz)return;let items=quiz.items.filter((it,i)=>!quiz.answers[i].correct).map(it=>it.type==='seq'?{...it}:shuffleOptions(it));startQuiz('practice',items)}
function startWords(){wordSession={items:sample(DATA.clozes,10),idx:0,revealed:false,answers:[]};view='wordview';render();window.scrollTo(0,0)}
const norm=s=>String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ');
function wordview(){if(!wordSession)return '';let w=wordSession;if(w.idx>=w.items.length){let ok=w.answers.filter(x=>x.correct).length;return `<section class="card result-score"><span class="splash">✏️</span><h1>Palabras completadas</h1><strong>${ok} / ${w.items.length}</strong><p>¡Cada término aprendido te ayuda a comprender mejor el tema!</p><button class="btn primary" onclick="go('practice')">Volver a practicar</button></section>`}let it=w.items[w.idx],ans=w.answers[w.idx];return `<div class="mainhead"><div><p class="eyebrow">Reto de vocabulario</p><h1>Completa la palabra</h1><p class="muted">Escribe el término que completa la frase. No importa si olvidas alguna tilde.</p></div><span class="tag">${w.idx+1} / ${w.items.length}</span></div>${progress(Math.round(w.idx/w.items.length*100))}<section class="card" style="margin-top:17px"><span class="tag">${nameOf(it.t)}</span><h2 style="margin:17px 0">${esc(it.q)}</h2><form onsubmit="checkWord(event)" class="btnrow" style="align-items:stretch"><label class="sr-only" for="wordAnswer">Escribe la palabra</label><input class="wordinput" id="wordAnswer" placeholder="Escribe tu respuesta" autocomplete="off" spellcheck="false" ${ans?'disabled':''} required><button class="btn primary" type="submit" ${ans?'disabled':''}>Corregir</button></form>${ans?`<div class="feedback ${ans.correct?'':'bad'}"><strong>${ans.correct?'¡Muy bien! ✨':'La respuesta que buscamos es:'}</strong>${esc(it.answer)}${!ans.correct?`<p class="small" style="margin-top:5px">Tu respuesta: ${esc(ans.entered)}</p>`:''}</div><button class="btn primary" style="margin-top:18px" onclick="nextWord()">${w.idx===w.items.length-1?'Terminar':'Siguiente →'}</button>`:''}</section>`}
function checkWord(e){e.preventDefault();let w=wordSession;if(w.answers[w.idx])return;let entered=$('wordAnswer').value;let correct=w.items[w.idx].accepted.some(a=>norm(a)===norm(entered));w.answers[w.idx]={entered,correct};S.stats.words++;if(correct)S.stats.wordsCorrect++;save();render()}
function nextWord(){wordSession.idx++;render()}
function startOrder(){orderSession={items:rand(DATA.seqs),idx:0,pool:[],selected:[],answers:[],revealed:false};view='orderview';render();window.scrollTo(0,0)}
function orderview(){let o=orderSession;if(!o)return '';if(o.idx>=o.items.length)return `<section class="card result-score"><span class="splash">🔄</span><h1>¡Reto de secuencias terminado!</h1><strong>${o.answers.filter(x=>x).length} / ${o.items.length}</strong><p>Ahora intenta explicar esos recorridos sin mirar.</p><button class="btn primary" onclick="go('practice')">Volver a practicar</button></section>`;let it=o.items[o.idx];if(!o.pool.length){o.pool=rand(it.parts.map((p,i)=>({p,i})));if(o.pool.every((x,i)=>x.i===i))o.pool.reverse()}let answered=o.answers.length>o.idx,correct=o.answers[o.idx];return `<div class="mainhead"><div><p class="eyebrow">Piezas en orden</p><h1>Ordena y aprende</h1><p class="muted">Toca las piezas en el orden correcto. No hay cronómetro.</p></div><span class="tag">${o.idx+1} / ${o.items.length}</span></div>${progress(Math.round(o.idx/o.items.length*100))}<section class="card" style="margin-top:18px"><span class="tag">${nameOf(it.t)}</span><h2 style="margin:14px 0">${esc(it.q)}</h2><div class="sequence-area answerline">${o.selected.length?o.selected.map((x,i)=>`<span class="steppill">${esc(it.parts[x])}</span>${i<o.selected.length-1?'<span class="seqarrow">→</span>':''}`).join(''):'<span class="muted">Toca las piezas para formar tu secuencia.</span>'}</div><div class="sequence-area">${o.pool.filter(x=>!o.selected.includes(x.i)).map(x=>`<button class="stepchip" ${answered?'disabled':''} onclick="orderPick(${x.i})">${esc(x.p)}</button>`).join('')}</div><div class="btnrow"><button class="btn" onclick="orderUndo()" ${answered||!o.selected.length?'disabled':''}>Deshacer</button><button class="btn primary" onclick="orderCheck()" ${answered||o.selected.length!==it.parts.length?'disabled':''}>Comprobar</button></div>${answered?`<div class="feedback ${correct?'':'bad'}"><strong>${correct?'¡Secuencia correcta! 🌟':'¡Ahora ya sabes el orden! 🔎'}</strong><div>${esc(it.parts.join(' → '))}</div></div><button class="btn primary" onclick="orderNext()" style="margin-top:15px">${o.idx===o.items.length-1?'Ver resultado':'Siguiente →'}</button>`:''}</section>`}
function orderPick(n){const o=orderSession;if(o.answers.length>o.idx||o.selected.includes(n))return;o.selected.push(n);render()}
function orderUndo(){const o=orderSession;if(o.selected.length)o.selected.pop();render()}
function orderCheck(){const o=orderSession;let it=o.items[o.idx];if(o.selected.length!==it.parts.length)return;let ok=o.selected.every((i,j)=>i===j);o.answers.push(ok);S.stats.orders++;if(ok)S.stats.ordersCorrect++;save();render()}
function orderNext(){const o=orderSession;o.idx++;o.selected=[];o.pool=[];render()}
const cellParts=[{id:'membrana',name:'Membrana celular',why:'Rodea la célula, la protege y regula la entrada y salida de sustancias.'},{id:'citoplasma',name:'Citoplasma',why:'Es el líquido interior donde se encuentran los orgánulos.'},{id:'nucleo',name:'Núcleo',why:'Contiene el material genético que controla el funcionamiento celular.'},{id:'organulos',name:'Orgánulos',why:'Son estructuras del citoplasma que realizan diferentes funciones.'}];
function startCell(){cellSession={items:rand(cellParts),idx:0,attempts:0,feedback:null,firstHit:true};view='cellview';render();window.scrollTo(0,0)}
function cellSvg(){return `<div class="cellart"><svg role="img" aria-label="Esquema interactivo de una célula: señala las partes usando los círculos numerados" viewBox="0 0 620 355"><ellipse cx="310" cy="178" rx="265" ry="145" fill="var(--paper)" stroke="var(--accentdeep)" stroke-width="7"/><ellipse cx="330" cy="178" rx="77" ry="85" fill="var(--soft)" stroke="var(--accentdeep)" stroke-width="4"/><ellipse cx="170" cy="118" rx="26" ry="18" fill="var(--second)" opacity=".65" stroke="var(--accentdeep)" stroke-width="2"/><ellipse cx="452" cy="131" rx="26" ry="18" fill="var(--second)" opacity=".65" stroke="var(--accentdeep)" stroke-width="2"/><ellipse cx="440" cy="242" rx="27" ry="18" fill="var(--second)" opacity=".65" stroke="var(--accentdeep)" stroke-width="2"/><ellipse cx="222" cy="242" rx="23" ry="15" fill="var(--second)" opacity=".65" stroke="var(--accentdeep)" stroke-width="2"/>${[[530,95,'membrana','1'],[173,183,'citoplasma','2'],[330,182,'nucleo','3'],[440,242,'organulos','4']].map(([x,y,id,num])=>`<g class="hotspot" role="button" tabindex="0" aria-label="Señalar zona ${num}" onclick="cellHit('${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();cellHit('${id}')}"><circle cx="${x}" cy="${y}" r="22"/><text text-anchor="middle" dominant-baseline="middle" x="${x}" y="${y+1}">${num}</text></g>`).join('')}</svg></div>`}
function cellview(){let c=cellSession;if(!c)return '';if(c.idx>=c.items.length)return `<div class="card result-score"><span class="splash">🏅</span><h1>¡Has terminado el reto de la célula!</h1><p>Ya has señalado sus cuatro partes. Puedes seguir practicando o repasar sus funciones.</p><div class="btnrow" style="justify-content:center"><button class="btn primary" onclick="go('practice')">Volver a practicar</button><button class="btn" onclick="startCell()">Repetir reto</button></div></div>`;let it=c.items[c.idx];return `<div class="mainhead"><div><p class="eyebrow">Reto visual autocorregible</p><h1>Explora la célula</h1><p class="muted">Pulsa uno de los números del dibujo que señala la parte que se pide. Puedes volver a intentarlo.</p></div><span class="tag">${c.idx+1} / 4</span></div>${progress(c.idx*25)}<div class="diagram-layout" style="margin-top:17px"><section class="card"><h2>¿Dónde está el <span style="color:var(--accentdeep)">${esc(it.name.toLowerCase())}</span>?</h2>${cellSvg()}<p class="small muted" style="margin-top:9px">También puedes usar los botones numerados:</p><div class="hotlegend">${[['membrana','1'],['citoplasma','2'],['nucleo','3'],['organulos','4']].map(([k,v])=>`<button class="btn small" ${c.feedback?.correct?'disabled':''} onclick="cellHit('${k}')">Zona ${v}</button>`).join('')}</div></section><aside class="card"><h3>Aprende observando 🔎</h3><p>Fíjate en el borde exterior, el líquido que rellena la célula, el núcleo y las estructuras pequeñas del interior.</p>${c.feedback?`<div class="feedback ${c.feedback.correct?'':'bad'}"><strong>${c.feedback.correct?'¡Sí, la has encontrado!':'Esa no es la parte que buscamos. Prueba otra vez.'}</strong>${c.feedback.correct?esc(it.why):'Busca una zona diferente del dibujo.'}</div>`:''}${c.feedback?.correct?`<button class="btn primary full" style="margin-top:15px" onclick="cellNext()">${c.idx===3?'Terminar reto':'Siguiente parte →'}</button>`:''}<p class="small muted" style="margin-top:16px">Los dibujos son esquemas educativos simplificados; las funciones se han tomado de tu documento.</p></aside></div>`}
function cellHit(id){let c=cellSession;if(!c||c.feedback?.correct)return;let ok=id===c.items[c.idx].id;c.attempts++;if(!ok)c.firstHit=false;c.feedback={correct:ok};if(ok&&c.firstHit){S.cellKnown=S.cellKnown||{};S.cellKnown[id]=true;save()}render()}
function cellNext(){let c=cellSession;c.idx++;c.feedback=null;c.attempts=0;c.firstHit=true;render()}
function sectionSteps(t){const labels={relacion:['Estímulo','Receptores / sentidos','Sistema nervioso','Respuesta'],respiracion:['Nariz o boca','Faringe','Laringe','Tráquea','Bronquios','Pulmones','Alvéolos'],excrecion:['Riñones','Uréteres','Vejiga urinaria','Uretra'],organizacion:['Célula','Tejido','Órgano','Aparato o sistema','Organismo'],reproduccion:['Fecundación','Embarazo','Parto']};return labels[t]?`<div class="stepsline">${labels[t].map((x,i)=>`<span class="steppill">${esc(x)}</span>${i<labels[t].length-1?'<span class="seqarrow">→</span>':''}`).join('')}</div>`:''}
function study(){return `<div class="mainhead"><div><p class="eyebrow">Resumen para estudiar</p><h1>Todo el Tema 1, por apartados</h1><p class="muted">Estas definiciones y recorridos se han extraído de los dos documentos que acompañan al tema. Abre cada bloque para repasarlo.</p></div><span class="tag">10 bloques</span></div><div class="module-list">${DATA.topics.map((t,ti)=>{let cs=DATA.cards.filter(x=>x.t===t.id);return `<details class="chapter" ${ti===0?'open':''}><summary><span>${t.emoji} ${esc(t.title)}</span><span class="small muted">${cs.length} conceptos</span></summary><div class="chapter-inner">${sectionSteps(t.id)}<dl>${cs.map(c=>`<dt>${esc(c.q)}</dt><dd>${esc(c.a)}</dd>`).join('')}</dl><button class="btn ghost small" onclick="openTopic('${t.id}')">Practicar tarjetas de este bloque →</button></div></details>`}).join('')}</div><div class="note" style="margin-top:17px">💡 Al explicar cada respuesta con tus palabras, compruebas que la entiendes y no solo que la recuerdas.</div>`}
function settings(){return `<div class="mainhead"><div><p class="eyebrow">Espacio de personalización</p><h1>Haz la aplicación a tu gusto 🎨</h1><p class="muted">Cambia la apariencia desde la pantalla principal. Los ajustes se guardarán en este dispositivo.</p></div></div><div class="workgrid"><section class="card"><h2>Colores y lectura</h2><div class="rowfield"><strong>Paleta de colores</strong><div class="colors">${[['menta','🌿 Menta'],['azul','🌊 Azul'],['lavanda','💜 Lavanda'],['coral','🌅 Coral'],['noche','🌙 Noche']].map(([v,n])=>`<button class="color-choice ${S.theme===v?'on':''}" onclick="setTheme('${v}')" aria-pressed="${S.theme===v}">${n}</button>`).join('')}</div></div><div class="rowfield"><strong><label for="fontSize">Tamaño de letra</label></strong><div><input id="fontSize" class="range" type="range" min="14" max="22" step="1" value="${S.font}" oninput="setFont(this.value)" aria-valuetext="${S.font} píxeles"><strong id="fontSizeLabel">${S.font}px</strong><p class="small muted">Se aplica a tarjetas, preguntas y el resto de la aplicación.</p></div></div><div class="rowfield"><strong>Vista previa</strong><div class="tone"><h3>¿Qué hacen las neuronas?</h3><p>Reciben y transmiten información.</p><span class="tag">Ejemplo de tarjeta</span></div></div><div class="btnrow" style="margin-top:20px"><button class="btn primary" onclick="go('home')">✓ Guardar y volver al inicio</button><button class="btn" onclick="resetPrefs()">Restaurar apariencia</button></div></section><aside class="card"><h3>Tu progreso está a salvo… si lo guardas</h3><p class="small muted">El navegador conserva las tarjetas y las notas en este dispositivo. Si cambias de Chromebook o se borran los datos, puedes restaurarlo desde una copia.</p><div class="btnrow"><button class="btn small" onclick="exportProgress()">⬇️ Exportar progreso</button><label class="btn small" style="cursor:pointer">⬆️ Importar copia<input type="file" accept=".json,application/json" hidden onchange="importProgress(event)"></label></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><p class="tiny muted">El archivo de copia solo incluye tus ajustes, tarjetas marcadas y resultados. No pide nombre, correo ni registra datos personales.</p><button class="btn small" onclick="resetAll()">Borrar progreso de este dispositivo</button></aside></div>`}
function setTheme(x){if(!THEMES.includes(x))return;S.theme=x;save();render()}
function setFont(x){S.font=Math.max(14,Math.min(22,parseInt(x)||16));save();applyPrefs();let e=$('fontSizeLabel');if(e)e.textContent=S.font+'px';document.querySelector('#fontSize')?.setAttribute('aria-valuetext',S.font+' píxeles')}
function resetPrefs(){S.theme='menta';S.font=16;save();render()}
function resetAll(){if(confirm('¿Borrar todas las tarjetas marcadas, prácticas y notas guardadas en este navegador? Esta acción no se puede deshacer.')){let t=S.theme,f=S.font;S=empty();S.theme=t;S.font=f;save();render()}}
function exportProgress(){const blob=new Blob([JSON.stringify({kind:'mision-naturales-5',version:1,saved:new Date().toISOString(),state:S},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='progreso-naturales-tema1.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function importProgress(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let z=JSON.parse(r.result);if(z.kind!=='mision-naturales-5'||!z.state||!z.state.stats||typeof z.state.known!=='object')throw Error('Archivo no válido');if(!confirm('¿Sustituir el progreso actual por el de esta copia?'))return;S={...empty(),...z.state,stats:{...empty().stats,...z.state.stats}};S.stats.exams=Array.isArray(S.stats.exams)?S.stats.exams:[];save();render();alert('Progreso importado correctamente.')}catch(err){alert('No se ha podido leer una copia válida de esta aplicación.')}};r.readAsText(f);e.target.value=''}
applyPrefs();render();
</script>
</body>
</html>
